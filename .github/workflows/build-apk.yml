name: Build Android APK

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install
          # Instalamos el plugin nativo de TTS recomendado para Android
          npm install @capacitor-community/text-to-speech

      - name: Add Android platform
        run: npx cap add android || echo "Android platform already exists"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/vamos-estudiar.jks
          ls -lh android/app/vamos-estudiar.jks

      - name: Create keystore.properties
        run: |
          cat > android/app/keystore.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=vamos-estudiar.jks
          EOF

      - name: Generate App Icons
        run: |
          npm install -g @capacitor/assets
          sudo apt-get update && sudo apt-get install -y imagemagick
          npx capacitor-assets generate --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#0D0F14'

      - name: Sync Web Assets & Plugins
        run: npx cap sync android

      - name: Configure Android Signing
        run: |
          # Inyectar carga de propiedades al inicio del build.gradle
          sed -i '1i def keystorePropertiesFile = rootProject.file("app/keystore.properties")\ndef keystoreProperties = new Properties()\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}' android/app/build.gradle
          
          # Inyectar bloque signingConfigs dentro de android { }
          sed -i '/android {/a\    signingConfigs {\n        release {\n            keyAlias keystoreProperties['\''keyAlias'\'']\n            keyPassword keadosProperties['\''keyPassword'\'']\n            storeFile file(keystoreProperties['\''storeFile'\''])\n            storePassword keystoreProperties['\''storePassword'\'']\n        }\n    }' android/app/build.gradle
          
          # Inyectar signingConfig dentro de buildTypes { release { }
          sed -i '/buildTypes {/,/release {/{s/release {/release {\n            signingConfig signingConfigs.release/}' android/app/build.gradle

      - name: Add Storage Permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Limpiar permisos antiguos duplicados
          sed -i '/WRITE_EXTERNAL_STORAGE/d' "$MANIFEST"
          sed -i '/READ_EXTERNAL_STORAGE/d' "$MANIFEST"
          # Añadir permisos modernos (Android 13+) y legacy con maxSdkVersion
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>' "$MANIFEST"

      - name: Inject FileAccess plugin and MainActivity
        run: |
          set -e
          # Detectar el package name automáticamente
          PKG=$(grep -oP 'package="\K[^"]+' android/app/src/main/AndroidManifest.xml | head -1 || true)
          if [ -z "$PKG" ]; then
            PKG=$(grep -oP 'namespace\s+"\K[^"]+' android/app/build.gradle | head -1 || true)
          fi
          if [ -z "$PKG" ]; then
            PKG="com
