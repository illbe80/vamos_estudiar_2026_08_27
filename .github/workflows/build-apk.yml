name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      # ✅ Decodificar el Keystore directamente en android/app/
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/vamos-estudiar.jks
          ls -lh android/app/vamos-estudiar.jks

      # ✅ Crear keystore.properties dentro de android/app/ con ruta relativa simple
      - name: Create keystore.properties
        run: |
          cat > android/app/keystore.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=vamos-estudiar.jks
          EOF

      - name: Generate App Icons
        run: |
          npm install -g @capacitor/assets
          sudo apt-get update && sudo apt-get install -y imagemagick
          npx capacitor-assets generate --iconBackgroundColor '#ffffff'

      - name: Sync Web Assets
        run: npx cap sync android

      # ✅ Inyección robusta de la configuración de firma en build.gradle
      - name: Configure Android Signing
        run: |
          # 1. Cargar keystore.properties al inicio del archivo
          sed -i '1i def keystorePropertiesFile = rootProject.file("app/keystore.properties")\ndef keystoreProperties = new Properties()\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}' android/app/build.gradle
          
          # 2. Añadir el bloque signingConfigs justo después de "android {"
          sed -i '/android {/a\    signingConfigs {\n        release {\n            keyAlias keystoreProperties['\''keyAlias'\'']\n            keyPassword keystoreProperties['\''keyPassword'\'']\n            storeFile file(keystoreProperties['\''storeFile'\''])\n            storePassword keystoreProperties['\''storePassword'\'']\n        }\n    }' android/app/build.gradle
          
          # 3. Aplicar la firma al buildType "release"
          sed -i '/buildTypes {/,/release {/{s/release {/release {\n            signingConfig signingConfigs.release/}' android/app/build.gradle

      - name: Add Storage Permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/WRITE_EXTERNAL_STORAGE/d' "$MANIFEST"
          sed -i '/READ_EXTERNAL_STORAGE/d' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>' "$MANIFEST"

      - name: Build Release APK
        run: |
          chmod +x ./android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Find APK
        run: |
          find android -name "*.apk" -type f
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VamosAEstudiar-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
