name: Build Android APK

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # PASO CRÍTICO: Crear package.json dinámicamente ya que no existe en el repo
      - name: Create package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "vamos-a-estudiar",
            "version": "1.0.0",
            "scripts": { "build": "echo 'Static build'" },
            "dependencies": {
              "@capacitor/android": "^8.0.0",
              "@capacitor/cli": "^8.0.0",
              "@capacitor/core": "^8.0.0",
              "@capacitor/filesystem": "^8.0.0",
              "@capgo/capacitor-file-sharer": "^8.0.0"
            }
          }
          EOF

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Generate App Icons
        run: |
          npm install -g @capacitor/assets
          sudo apt-get update && sudo apt-get install -y imagemagick
          npx capacitor-assets generate --iconBackgroundColor '#ffffff'

      - name: Sync Web Assets
        run: npx cap sync android

      # Añadir permisos necesarios para guardar en Descargas en Android 10+
      - name: Add Storage Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>' "$MANIFEST"

      - name: Build Debug APK
        run: |
          chmod +x ./android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VamosAEstudiar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
