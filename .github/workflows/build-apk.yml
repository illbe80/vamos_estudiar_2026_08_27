name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install dependencies
        run: npm install
        
      - name: Add Android platform
        run: npx cap add android
        
      - name: Generate App Icons
        run: |
          npm install -g @capacitor/assets
          sudo apt-get update && sudo apt-get install -y imagemagick
          npx capacitor-assets generate --iconBackgroundColor '#ffffff'
          
      - name: Sync Web Assets
        run: npx cap sync android

        - name: Copiar Plugin de Accesibilidad
          run: |
            mkdir -p android/app/src/main/java/com/oposiciones/estudio2026
            cp android-custom/AccessibilityPlugin.java android/app/src/main/java/com/oposiciones/estudio2026/
        
        - name: Registrar Plugin en MainActivity
          run: |
            MAIN_ACTIVITY="android/app/src/main/java/com/oposiciones/estudio2026/MainActivity.java"
            # Añadir import
            sed -i '/import com.getcapacitor.BridgeActivity;/a\import com.oposiciones.estudio2026.AccessibilityPlugin;' "$MAIN_ACTIVITY"
            # Añadir al array de plugins dentro de onCreate
            sed -i 's/add(AccessibilityPlugin.class);//' "$MAIN_ACTIVITY" || true
            sed -i '/add(AccessibilityPlugin.class);/d' "$MAIN_ACTIVITY" || true
            # Insertar antes del cierre de addPlugins
            sed -i '/^        }$/i\            add(AccessibilityPlugin.class);' "$MAIN_ACTIVITY"
                
      - name: Build Debug APK
        run: |
          chmod +x ./android/gradlew
          cd android && ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VamosAEstudiar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
