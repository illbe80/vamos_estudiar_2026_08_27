name: Build Android APK
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # Capacitor 8 requiere Node 22+

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'   # Capacitor 8 recomienda Java 21

      - name: Install dependencies
        run: |
          npm install
          # @capgo/capacitor-file-sharer solo existe en v8 y exige @capacitor/core >= 8.
          # Subimos todo Capacitor a la v8 (el proyecto Android se regenera en el paso siguiente).
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/filesystem@8 @capgo/capacitor-file-sharer@8 --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Generate App Icons
        run: |
          npm install -g @capacitor/assets
          sudo apt-get update && sudo apt-get install -y imagemagick
          npx capacitor-assets generate --iconBackgroundColor '#ffffff'

      - name: Sync Web Assets
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          chmod +x ./android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VamosAEstudiar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
