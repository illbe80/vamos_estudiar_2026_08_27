name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/vamos-estudiar.jks
          ls -lh android/app/vamos-estudiar.jks

      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/vamos-estudiar.jks
          EOF

      - name: Generate App Icons
        run: |
          npm install -g @capacitor/assets
          sudo apt-get update && sudo apt-get install -y imagemagick
          npx capacitor-assets generate --iconBackgroundColor '#ffffff'

      - name: Sync Web Assets
        run: npx cap sync android

      - name: Configure Android Signing
        run: |
          # Añadir la carga del archivo keystore.properties al inicio del build.gradle
          sed -i '1i def keystoreProperties = new Properties()\
          def keystorePropertiesFile = rootProject.file('\''keystore.properties'\'')\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\
          }' android/app/build.gradle
          
          # Añadir la configuración de firma después de la declaración de plugins
          sed -i '/android {/a\
              signingConfigs {\
                  release {\
                      keyAlias keystoreProperties['\''keyAlias'\'']\
                      keyPassword keystoreProperties['\''keyPassword'\'']\
                      storeFile keystoreProperties['\''storeFile'\''] ? file(keystoreProperties['\''storeFile'\'']) : null\
                      storePassword keystoreProperties['\''storePassword'\'']\
                  }\
              }' android/app/build.gradle
          
          # Aplicar la firma al buildType release
          sed -i '/buildTypes {/,/}/{s/release {/release {\
                  signingConfig signingConfigs.release/}' android/app/build.gradle

      - name: Add Storage Permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i '/WRITE_EXTERNAL_STORAGE/d' "$MANIFEST"
          sed -i '/READ_EXTERNAL_STORAGE/d' "$MANIFEST"

          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>' "$MANIFEST"

      - name: Build Release APK
        run: |
          chmod +x ./android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Find APK
        run: |
          find android -name "*.apk" -type f
      
      - name: Show build.gradle
        run: |
          cat android/app/build.gradle
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VamosAEstudiar-APK
          path: android/app/build/outputs/apk/release/app-release.apk
