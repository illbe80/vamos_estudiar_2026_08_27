name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & Sync
        run: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/text-to-speech
          npx cap add android || true
          npx cap sync android

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/vamos-estudiar.jks

      - name: Configure Signing (Node.js method - 100% reliable)
        run: |
          # 1. Crear archivo de propiedades
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/keystore.properties
          echo "storeFile=vamos-estudiar.jks" >> android/app/keystore.properties

          # 2. Modificar build.gradle de forma segura con Node.js (sin errores de comillas de bash)
          node -e "
          const fs = require('fs');
          let gradle = fs.readFileSync('android/app/build.gradle', 'utf8');
          
          if (!gradle.includes('keystoreProperties')) {
            gradle = \"def keystorePropertiesFile = rootProject.file('app/keystore.properties')\\ndef keystoreProperties = new Properties()\\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }\\n\\n\" + gradle;
          }
          if (!gradle.includes('signingConfigs {')) {
            gradle = gradle.replace('android {', 'android {\\n    signingConfigs {\\n        release {\\n            keyAlias keystoreProperties[\\'keyAlias\\']\\n            keyPassword keystoreProperties[\\'keyPassword\\']\\n            storeFile file(keystoreProperties[\\'storeFile\\'])\\n            storePassword keystoreProperties[\\'storePassword\\']\\n        }\\n    }');
          }
          if (!gradle.includes('signingConfig signingConfigs.release')) {
            gradle = gradle.replace(/buildTypes\\s*\\{[\\s\\S]*?release\\s*\\{/, match => match + '\\n            signingConfig signingConfigs.release');
          }
          fs.writeFileSync('android/app/build.gradle', gradle);
          console.log('✅ build.gradle configurado para firma');
          "

      - name: Add Android 13+ Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/WRITE_EXTERNAL_STORAGE/d' "$MANIFEST"
          sed -i '/READ_EXTERNAL_STORAGE/d' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>' "$MANIFEST"

      - name: Build Release APK
        run: |
          chmod +x ./android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VamosAEstudiar-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
