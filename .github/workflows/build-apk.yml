name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor-community/text-to-speech

      - name: Add Android platform
        run: npx cap add android || echo "Android platform already exists"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/vamos-estudiar.jks
          ls -lh android/app/vamos-estudiar.jks

      - name: Create keystore.properties
        run: |
          cat > android/app/keystore.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=vamos-estudiar.jks
          EOF

      - name: Generate App Icons
        run: |
          npm install -g @capacitor/assets
          sudo apt-get update && sudo apt-get install -y imagemagick
          npx capacitor-assets generate --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#0D0F14'

      - name: Sync Web Assets & Plugins
        run: npx cap sync android

      - name: Configure Android and Inject Plugins
        run: |
          python3 << 'EOF'
          import os
          import re

          # 1. Leer el package name automáticamente
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          pkg = "com.oposiciones.estudio2026" # fallback por defecto
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  match = re.search(r'package="([^"]+)"', f.read())
                  if match:
                      pkg = match.group(1)
          
          print(f"Detected Package: {pkg}")
          pkg_path = pkg.replace('.', '/')
          dest_dir = f"android/app/src/main/java/{pkg_path}"
          os.makedirs(dest_dir, exist_ok=True)

          # 2. Modificar build.gradle para la firma de forma segura
          gradle_path = "android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()
              
              # Añadir keystore properties al inicio si no existe
              if "keystorePropertiesFile" not in content:
                  keystore_block = """def keystorePropertiesFile = rootProject.file("app/keystore.properties")
                  def keystoreProperties = new Properties()
                  if (keystorePropertiesFile.exists()) {
                      keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                  }
                  
                  """
                  content = keystore_block + content
              
              # Añadir signingConfigs dentro de android { }
              if "signingConfigs {" not in content:
                  content = re.sub(
                      r'(android\s*\{)',
                      r'\1\n    signingConfigs {\n        release {\n            keyAlias keystoreProperties[\'keyAlias\']\n            keyPassword keystoreProperties[\'keyPassword\']\n            storeFile file(keystoreProperties[\'storeFile\'])\n            storePassword keystoreProperties[\'storePassword\']\n        }\n    }',
                      content
                  )
              
              # Añadir signingConfig a buildTypes release
              if "signingConfig signingConfigs.release" not in content:
                  content = re.sub(
                      r'(buildTypes\s*\{\s*release\s*\{)',
                      r'\1\n            signingConfig signingConfigs.release',
                      content
                  )
              
              with open(gradle_path, 'w') as f:
                  f.write(content)
              print("✅ build.gradle configurado para firma")

          # 3. Crear FileAccessPlugin.java
          plugin_code = f'''package {pkg};

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "FileAccess")
          public class FileAccessPlugin extends Plugin {{
              private static final String PREFS = "FileAccessPrefs";
              private static final String KEY_URI = "saved_uri";
              private PluginCall savedCall;

              private SharedPreferences prefs() {{
                  return getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }}

              private void persistUri(Uri uri) {{
                  try {{
                      getContext().getContentResolver().takePersistableUriPermission(
                          uri,
                          Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      );
                  }} catch (Exception ignored) {{}}
                  prefs().edit().putString(KEY_URI, uri.toString()).apply();
              }}

              private String queryName(Uri uri) {{
                  String name = "examen.xlsx";
                  try (Cursor c = getContext().getContentResolver().query(uri, null, null, null, null)) {{
                      if (c != null && c.moveToFirst()) {{
                          int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (idx >= 0) name = c.getString(idx);
                      }}
                  }} catch (Exception ignored) {{}}
                  return name;
              }}

              @PluginMethod
              public void pickFileWithPermission(PluginCall call) {{
                  savedCall = call;
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("*/*");
                  intent.putExtra(Intent.EXTRA_MIME_TYPES, new String[] {{
                      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                      "application/vnd.ms-excel",
                      "application/octet-stream"
                  }});
                  intent.addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION
                      | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                  );
                  startActivityForResult(call, intent, "pickFileResult");
              }}

              @ActivityCallback
              private void pickFileResult(PluginCall call, ActivityResult result) {{
                  if (call == null) call = savedCall;
                  if (call == null) return;
                  if (result.getResultCode() != android.app.Activity.RESULT_OK || result.getData() == null) {{
                      JSObject ret = new JSObject();
                      ret.put("success", false);
                      call.resolve(ret);
                      return;
                  }}
                  Uri uri = result.getData().getData();
                  if (uri == null) {{
                      call.reject("URI nula");
                      return;
                  }}
                  final int takeFlags = result.getData().getFlags() &
                      (Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                  try {{
                      getContext().getContentResolver().takePersistableUriPermission(uri, takeFlags);
                  }} catch (Exception e) {{
                      try {{
                          getContext().getContentResolver().takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          );
                      }} catch (Exception ignored) {{}}
                  }}
                  persistUri(uri);
                  JSObject ret = new JSObject();
                  ret.put("success", true);
                  ret.put("uri", uri.toString());
                  ret.put("name", queryName(uri));
                  call.resolve(ret);
              }}

              @PluginMethod
              public void readFile(PluginCall call) {{
                  String uriStr = call.getString("uri");
                  if (uriStr == null || uriStr.isEmpty()) {{
                      uriStr = prefs().getString(KEY_URI, null);
                  }}
                  if (uriStr == null) {{
                      call.reject("No hay URI");
                      return;
                  }}
                  try {{
                      Uri uri = Uri.parse(uriStr);
                      InputStream in = getContext().getContentResolver().openInputStream(uri);
                      if (in == null) {{
                          call.reject("No se pudo abrir el archivo");
                          return;
                      }}
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) != -1) {{
                          bos.write(buf, 0, n);
                      }}
                      in.close();
                      JSObject ret = new JSObject();
                      ret.put("data", Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP));
                      call.resolve(ret);
                  }} catch (Exception e) {{
                      call.reject("Error leyendo: " + e.getMessage());
                  }}
              }}

              @PluginMethod
              public void writeFile(PluginCall call) {{
                  String uriStr = call.getString("uri");
                  String data = call.getString("data");
                  if (uriStr == null || uriStr.isEmpty()) {{
                      uriStr = prefs().getString(KEY_URI, null);
                  }}
                  if (uriStr == null) {{
                      call.reject("No hay URI para escribir");
                      return;
                  }}
                  if (data == null) {{
                      call.reject("No hay datos");
                      return;
                  }}
                  try {{
                      Uri uri = Uri.parse(uriStr);
                      byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                      OutputStream out = getContext().getContentResolver().openOutputStream(uri, "rwt");
                      if (out == null) {{
                          out = getContext().getContentResolver().openOutputStream(uri, "wt");
                      }}
                      if (out == null) {{
                          call.reject("No se pudo abrir OutputStream");
                          return;
                      }}
                      out.write(bytes);
                      out.flush();
                      out.close();
                      persistUri(uri);
                      JSObject ret = new JSObject();
                      ret.put("success", true);
                      call.resolve(ret);
                  }} catch (Exception e) {{
                      call.reject("Error escribiendo: " + e.getMessage());
                  }}
              }}

              @PluginMethod
              public void getSavedFileUri(PluginCall call) {{
                  String uriStr = prefs().getString(KEY_URI, null);
                  JSObject ret = new JSObject();
                  if (uriStr == null) {{
                      ret.put("uri", "");
                      ret.put("hasPermission", false);
                      call.resolve(ret);
                      return;
                  }}
                  ret.put("uri", uriStr);
                  ret.put("hasPermission", true);
                  call.resolve(ret);
              }}
          }}
          '''
          with open(f"{dest_dir}/FileAccessPlugin.java", 'w') as f:
              f.write(plugin_code)

          # 4. Crear MainActivity.java
          main_code = f'''package {pkg};

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  registerPlugin(FileAccessPlugin.class);
                  super.onCreate(savedInstanceState);
              }}
          }}
          '''
          with open(f"{dest_dir}/MainActivity.java", 'w') as f:
              f.write(main_code)
          
          print("✅ Plugins Java inyectados correctamente")
          EOF

      - name: Add Storage Permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/WRITE_EXTERNAL_STORAGE/d' "$MANIFEST"
          sed -i '/READ_EXTERNAL_STORAGE/d' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>' "$MANIFEST"

      - name: Build Release APK
        run: |
          chmod +x ./android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Find APK
        run: find android -name "*.apk" -type f

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VamosAEstudiar-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
        
